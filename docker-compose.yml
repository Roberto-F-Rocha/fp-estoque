services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: fpestoque
      POSTGRES_USER: fpestoque
      POSTGRES_PASSWORD: fpestoque
    ports: ['5432:5432']
  backend:
    image: python:3.12-slim
    working_dir: /app
    volumes: ['./backend:/app']
    command: sh -c 'pip install -r requirements.txt && python manage.py migrate && python manage.py runserver 0.0.0.0:8000'
    environment:
      DATABASE_URL: postgresql://fpestoque:fpestoque@db:5432/fpestoque
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    ports: ['8000:8000']
    depends_on: [db]
  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes: ['./frontend:/app']
    command: sh -c 'npm install && npm run dev -- --host 0.0.0.0'
    environment:
      VITE_API_URL: http://localhost:8000/api/
    ports: ['5173:5173']
    depends_on: [backend]
