name: CI

on:
  push:
    branches:
      - main
      - feat/sistema-completo
  pull_request:
    branches:
      - main

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: fpestoque
          POSTGRES_USER: fpestoque
          POSTGRES_PASSWORD: fpestoque
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U fpestoque -d fpestoque"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: backend

    env:
      DJANGO_SECRET_KEY: ci-only-secret-key
      DEBUG: "false"
      DATABASE_URL: postgresql://fpestoque:fpestoque@127.0.0.1:5432/fpestoque?sslmode=disable
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:5173

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Verificar configuração do Django
        run: python manage.py check

      - name: Aplicar migrações
        run: python manage.py migrate --noinput

      - name: Verificar alterações de modelos sem migração
        run: python manage.py makemigrations --check --dry-run

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependências
        run: npm install

      - name: Gerar build
        run: npm run build
