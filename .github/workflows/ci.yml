name: CI Desktop Local

on:
  pull_request:
  push:
    branches: [main, feat/sistema-completo, feat/desktop-local]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      FP_DESKTOP_MODE: "true"
      FP_DATA_DIR: ${{ runner.temp }}/fp-estoque-data
      DJANGO_SECRET_KEY: ci-only-secret-key-at-least-thirty-two-characters
      DEBUG: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - name: Run backend tests
        run: |
          set -o pipefail
          python manage.py test inventory -v 1 2>&1 | tee test-output.log
      - name: Upload backend test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-log
          path: backend/test-output.log
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install
      - run: npm run build
      - run: npm run build:desktop
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-frontend
          path: backend/desktop_frontend

  desktop-package:
    runs-on: windows-latest
    needs: [backend, frontend]
    env:
      FP_DESKTOP_MODE: "true"
      DJANGO_SECRET_KEY: ci-only-secret-key-at-least-thirty-two-characters
      DEBUG: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-desktop.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install --upgrade pip
      - run: pip install -r backend/requirements-desktop.txt
      - name: Build desktop frontend
        working-directory: frontend
        run: |
          npm install
          npm run build:desktop
      - name: Build Windows application
        run: pyinstaller --noconfirm --clean desktop/fp_estoque.spec
      - uses: actions/upload-artifact@v4
        with:
          name: FP-Estoque-Desktop-Windows
          path: dist/FP Estoque
          if-no-files-found: error
